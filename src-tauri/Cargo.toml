[package]
name = "glint"
version = "0.2.6"
description = "A lightweight floating Codex quota monitor"
authors = ["Glint and Quota Float contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "glint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "sync", "process", "io-util", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSWorkspace", "NSRunningApplication", "NSEvent"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGWindow", "CGGeometry"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSRunLoop", "NSDate", "NSURL", "NSProcessInfo"] }
